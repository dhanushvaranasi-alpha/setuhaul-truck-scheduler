[project]
name = "setuhaul"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-community==0.3.*",
    "langchain-core==0.3.*",
    "langchain-openai==0.2.*",
    "langchain-postgres>=0.0.17",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.2",
]

[tool.ruff.lint]
select = ["DTZ"]

[tool.pytest.ini_options]
filterwarnings = [
    # TODO(post-Saturday): migrate off RunnableWithMessageHistory to LangGraph's
    # built-in persistence (src/agent.py). Suppressed here only for clean test
    # output — the warning still surfaces in real (non-pytest) logs.
    "ignore:RunnableWithMessageHistory is deprecated:langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]
